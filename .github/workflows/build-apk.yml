name: Crear APK Nativo Phantom Habits

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Preparar carpeta web e instalar Capacitor
        run: |
          mkdir -p www
          find . -maxdepth 1 -name "*.html" -exec cp {} www/index.html \;
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          echo '{"name":"phantom-habits","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.pablots.phantomhabits","appName":"Phantom Habits","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: 5. Configurar Pantalla Completa y Logo Personalizado
        run: |
          # Estilos sin barras
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<style name="AppTheme" parent="Theme.AppCompat.NoActionBar">\n<item name="windowActionBar">false</item>\n<item name="windowNoTitle">true</item>\n<item name="android:background">#0a0a0a</item>\n<item name="android:windowBackground">#0a0a0a</item>\n<item name="android:statusBarColor">#0a0a0a</item>\n<item name="android:navigationBarColor">#080808</item>\n</style>\n<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">\n<item name="windowActionBar">false</item>\n<item name="windowNoTitle">true</item>\n<item name="android:background">#0a0a0a</item>\n<item name="android:windowBackground">#0a0a0a</item>\n<item name="android:statusBarColor">#0a0a0a</item>\n<item name="android:navigationBarColor">#080808</item>\n</style>\n<style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">\n<item name="android:background">#0a0a0a</item>\n</style>\n</resources>\n' > android/app/src/main/res/values/styles.xml

          # Buscar el icono disponible en el repo
          ICON_FILE=""
          if [ -f "android-chrome-512x512.png" ]; then ICON_FILE="android-chrome-512x512.png";
          elif [ -f "icon.png" ]; then ICON_FILE="icon.png"; fi

          if [ -n "$ICON_FILE" ]; then
            # Borrar los iconos vectoriales XML por defecto que bloquean el PNG
            rm -rf android/app/src/main/res/mipmap-anydpi-v26/*
            
            # Copiar tu icono en todas las densidades de mipmap de Android
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi anydpi-v26; do
              mkdir -p "android/app/src/main/res/mipmap-$d"
              cp "$ICON_FILE" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp "$ICON_FILE" "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done
          fi
          
      - name: 6. Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: PhantomHabits-APK-Nativo
          path: android/app/build/outputs/apk/debug/app-debug.apk
